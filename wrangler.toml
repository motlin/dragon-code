# One Worker: the built game as static assets, and the gallery and high-score API in front of D1.
#
#   just worker   builds, applies the migrations to a local D1 and serves everything on miniflare
#   just deploy   applies the migrations to the production D1 and deploys to dragon-code.motlin.com
#
# The custom domain is a flag on `wrangler deploy` (see the deploy recipe and .github/workflows/deploy.yml)
# rather than a route here, the same way whos-that does it.
name = "dragon-code"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "dist"
binding = "ASSETS"
# Only /api/* reaches the Worker first; every other path is the game's static files.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dragon-code"
database_id = "0c16ab6e-f1e3-41c2-ba41-8faa2469b6fe"
migrations_dir = "migrations"
